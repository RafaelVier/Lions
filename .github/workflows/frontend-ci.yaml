name: Frontend CI/CD

on:
  workflow_dispatch: # Permite rodar manualmente pela aba Actions
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  push:
    branches:
      - main # Só faz push no Docker Hub e deploy na VM quando entra na main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yaml'

permissions:
  contents: read

concurrency:
  # Evita execuções simultâneas antigas na mesma branch/workflow
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, test, publish and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
        shell: bash

    steps:
      # 1. Baixa o código do repositório
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Verifica se já existe frontend/package.json
      - name: Check frontend project files
        run: |
          if [[ ! -f package.json ]]; then
            echo "::notice::Ainda não existe frontend/package.json. Pulando etapas de Node/build por enquanto."
            echo "HAS_PACKAGE_JSON=false" >> "$GITHUB_ENV"
          else
            echo "HAS_PACKAGE_JSON=true" >> "$GITHUB_ENV"
          fi

      # 3. Configura Node.js 22.x com cache do npm
      - name: Set up Node.js
        if: env.HAS_PACKAGE_JSON == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. Instala dependências de forma limpa via lockfile
      - name: Install dependencies
        if: env.HAS_PACKAGE_JSON == 'true'
        run: npm ci

      # 5. Roda verificações do front-end (formatação, lint, testes e build)
      - name: Run frontend checks (format, lint, test, build)
        if: env.HAS_PACKAGE_JSON == 'true'
        run: npm run check

      # 6. Prepara Docker Buildx para build e cache
      - name: Set up Docker Buildx
        if: env.HAS_PACKAGE_JSON == 'true'
        uses: docker/setup-buildx-action@v4

      # 7. Gera tags da imagem usando FRONTEND_DOCKERHUB_IMAGE (com fallback para DOCKERHUB_IMAGE)
      - name: Generate Docker image tags
        id: docker-meta
        if: env.HAS_PACKAGE_JSON == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.FRONTEND_DOCKERHUB_IMAGE || vars.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # 8. Garante que as variáveis e o token do Docker Hub estão preenchidos antes do login
      - name: Validate Docker Hub configuration
        if: env.HAS_PACKAGE_JSON == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DOCKERHUB_IMAGE: ${{ vars.FRONTEND_DOCKERHUB_IMAGE || vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_IMAGE" || -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
      - name: Log in to Docker Hub

        if: env.HAS_PACKAGE_JSON == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v4

        with:

          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # 10. Faz build da imagem do front e publica no Docker Hub quando entra na branch padrão
      - name: Build and push Docker image
        if: env.HAS_PACKAGE_JSON == 'true'

        uses: docker/build-push-action@v7

        with:

          context: ./frontend
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

          tags: ${{ steps.docker-meta.outputs.tags }}

          labels: ${{ steps.docker-meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

# 11. Conecta na VM via SSH e atualiza o serviço do front-end se ele já existir no Compose
      - name: Deploy to VM via SSH
        if: env.HAS_PACKAGE_JSON == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          port: ${{ vars.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            SERVICE_NAME="frontend"

            cd "${{ vars.DEPLOY_PATH }}"

            # Verifica se o serviço já está declarado no docker-compose.yml da VM
            if docker compose config --services | grep -qx "$SERVICE_NAME"; then
              docker compose pull "$SERVICE_NAME"
              docker compose up -d --no-deps "$SERVICE_NAME"
              docker image prune -f
            else
              echo "Serviço '$SERVICE_NAME' ainda não está no docker-compose.yml em ${{ vars.DEPLOY_PATH }}. Pulando deploy do container por enquanto."
            fi
