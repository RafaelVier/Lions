name: Backend CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Nova versão do backend (ex.: 1.0.0 ou 1.1.0-SNAPSHOT)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test version script
        run: node --test scripts/version.test.mjs

      - name: Resolve and update application version
        id: version
        env:
          NEW_VERSION: ${{ inputs.new_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && -z "$NEW_VERSION" ]]; then
            echo "::error::Informe a nova versão para publicar."
            exit 1
          fi
          current_version=$(node scripts/version.mjs)
          version=$(node scripts/version.mjs "$NEW_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Versão do backend"
            echo "- Versão atual no código: $current_version"
            echo "- Versão desta execução: $version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test
        run: bash ./gradlew clean build bootJar --no-daemon --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare executable JAR for Docker
        if: github.event_name == 'workflow_dispatch'
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one executable Spring Boot JAR in backend/build/libs."
            exit 1
          fi
          mkdir -p build/docker
          cp "${jars[0]}" build/docker/app.jar

      - name: Upload executable JAR
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/docker/app.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Docker image and save version
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate publishing configuration
        env:
          REF_TYPE: ${{ github.ref_type }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$REF_TYPE" != branch ]]; then
            echo "::error::Select a branch to publish and save the new version."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_IMAGE" || -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure DOCKERHUB_IMAGE and DOCKERHUB_USERNAME variables and the DOCKERHUB_TOKEN secret."
            exit 1
          fi

      - name: Download tested executable JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker image tags
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit application version to selected branch
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          node backend/scripts/version.mjs "$APP_VERSION"
          git add backend/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Version is already $APP_VERSION; no commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(backend): release $APP_VERSION"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
