name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Gradle build files
        run: |
          for file in gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=backend/$file::Missing Gradle Wrapper file. Commit the backend build files and wrapper before running CI."
              exit 1
            fi
          done
          if [[ ! -f build.gradle.kts && ! -f build.gradle ]]; then
            echo "::error::Missing backend/build.gradle.kts or backend/build.gradle. Commit the backend build configuration before running CI."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test
        run: bash ./gradlew build bootJar --no-daemon --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare executable JAR for Docker
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one executable Spring Boot JAR in backend/build/libs."
            exit 1
          fi
          mkdir -p build/docker
          cp "${jars[0]}" build/docker/app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker image tags
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'lions-backend' }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Validate Docker Hub configuration
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_IMAGE" || -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure DOCKERHUB_IMAGE and DOCKERHUB_USERNAME repository variables and the DOCKERHUB_TOKEN secret."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image and publish from default branch
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
