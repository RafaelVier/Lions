spring:
  application:
    name: lions-backend
  profiles:
    active: dev
  # Flyway só no perfil prod (PostgreSQL, db/migration); dev/teste usam H2 com schema gerado pelo Hibernate
  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /

# Springdoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true

# Lions — segurança, armazenamento, rotinas e CORS
lions:
  security:
    jwt:
      # Em produção defina LIONS_JWT_SECRET (Base64, >= 256 bits); o default é apenas para desenvolvimento
      secret: ${LIONS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 1800000 # 30 minutos
    default-admin:
      username: ${LIONS_ADMIN_USERNAME:marcio}
      password: ${LIONS_ADMIN_PASSWORD:Lions@123}
      email: ${LIONS_ADMIN_EMAIL:marcio@lionsmedianeira.org.br}
  storage:
    base-dir: ${LIONS_STORAGE_DIR:./data/storage}
  scheduling:
    enabled: true
    # Fuso das rotinas; vazio = fuso do servidor (o mesmo do Clock da aplicação). Em produção use TZ=America/Sao_Paulo.
    zone: ${LIONS_SCHEDULING_ZONE:}
    # Expressões cron do Spring (segundo minuto hora dia mês dia-da-semana)
    cron:
      overdue-loans: "0 0 1 * * *"            # RN27 — diária, 01:00
      preventive-maintenance: "0 30 1 * * *"  # RN39 — diária, 01:30
      reservation-expiration: "0 */15 * * * *" # RN33 — a cada 15 min
      notification-retry: "0 5/15 * * * *"    # RN48 — a cada 15 min (defasada 5 min)
      daily-summary: "0 0 7 * * *"            # RN49 — diária, 07:00
      due-date-reminders: "0 0 8 * * *"       # RN46/RF12 — diária, 08:00
      session-expiration: "0 */5 * * * *"     # RN57 — a cada 5 min
  notification:
    # auto = envia pelo provedor configurado do canal (sem provedor → contato manual); manual; simulate (só log)
    mode: ${LIONS_NOTIFICATION_MODE:auto}
    email:
      # Remetente; o servidor SMTP vem de spring.mail.* (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME...)
      from: ${LIONS_NOTIFICATION_EMAIL_FROM:}
    twilio:
      # SMS e WhatsApp (https://www.twilio.com). Sem credenciais, esses canais viram contato manual (RN47).
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      sms-from: ${TWILIO_SMS_FROM:}
      whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
  cors:
    # Lista de origens (padrões aceitos, ex.: https://*.lionsmedianeira.org.br)
    allowed-origins:
      - "*"

# Management & Health (somente /actuator/health é público)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
