[project]
name = "lions-rag"
version = "0.1.0"
description = "Serviço de respostas do projeto Lions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pypdf>=6,<8",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test*.py"]
