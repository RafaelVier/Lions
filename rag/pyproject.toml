[project]
name = "lions-rag"
version = "0.1.0"
description = "Serviço de respostas do projeto Lions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "pypdf>=6,<8",
    "python-docx>=1.1,<2",
    "sentence-transformers>=5,<6",
    "sqlalchemy>=2.0,<3",
    "torch>=2.6,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test*.py"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
